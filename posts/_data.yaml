type: post
layout: post.tsx
transformImages:
  - resize: [900]
    matches: cover
    suffix: -big
    format: webp

  - resize: [225]
    matches: cover
    suffix: -small
    # Low-quality placeholder blurred behind the cover (CSS blur(20px)),
    # so compression artifacts are invisible and the file stays tiny.
    format:
      format: webp
      quality: 30

  - resize: [900]
    format: [webp, png, jpg, gif]

metas:
  site: vraton's site
  fediverse: "@v_raton@bolha.us"
  lang: pt-BR
  generator: true
  title: "=title || $ h1"
  description: "=description"
  image: "$ img.high.cover attr(src)"
  keywords: "=tags"
  color: "black"
